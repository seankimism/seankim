name: Scheduled portfolio merge

on:
  schedule:
    # September 28, 00:01 EDT = 04:01 UTC. The script also checks the year.
    - cron: '1 4 28 9 *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate and build without merging or deploying'
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: read
  actions: write

concurrency:
  group: scheduled-portfolio-merge
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the publishing branch
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Check release safeguards
        run: node --test .github/scripts/scheduled-merge.test.mjs
      - name: Build and release only when due
        run: node .github/scripts/scheduled-merge.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          SITE_URL: https://seankimism.github.io
          SITE_BASE_PATH: /seankim
