<body>
  <main>
    <section class="explorer" aria-label="Interactive bioreactor simulation">
      <form id="volume-form" class="volume-controls">
        <label for="volume">Media volume</label>
        <div class="volume-range">
          <input id="volume-slider" class="time-range" type="range" min="400" max="2000" step="1" value="1000" aria-label="Media volume in liters">
          <div class="slider-ends"><span>400 L</span><span>2,000 L</span></div>
        </div>
        <div class="volume-input"><input id="volume" type="number" min="400" max="2000" step="1" value="1000" required inputmode="numeric" aria-describedby="simulation-status"><span aria-hidden="true">L</span></div>
        <button id="simulate" class="simulate-button" type="submit">Simulate</button>
        <p id="simulation-status" class="simulation-status" role="status" aria-live="polite">Showing 1,000 L</p>
      </form>
      <div class="visuals">
        <div class="vessel-panel">
          <canvas id="vessel" class="vessel-canvas" tabindex="0" aria-label="Rotatable 3D cutaway of the bioreactor. Horizontal rings are steel mesh bands. Pink is liquid, teal is headspace air, and red is the water jacket. Drag or use arrow keys to rotate; Home resets the view."></canvas>
          <div class="view-help"><span>Drag to turn · arrow keys also work</span><button type="button" class="text-button" id="reset-view">Reset view</button></div>
          <div class="material-legend" id="material-legend" aria-label="Component colors">
            <span class="legend-item"><i class="dot water"></i>Water jacket</span><span class="legend-item"><i class="dot steel"></i>Steel</span><span class="legend-item"><i class="dot media"></i>Liquid</span><span class="legend-item"><i class="dot air"></i>Air</span>
          </div>
          <div class="temperature-key" id="temperature-key"><div class="bar"></div><div class="key-labels"><span id="color-min"></span><span>Steel temperature</span><span id="color-max"></span></div></div>
        </div>
        <div class="chart-panel">
          <h2 id="chart-heading" class="chart-heading">Temperature over time</h2>
          <div class="live-values" aria-label="Temperatures at the selected time">
            <div><p class="live-value-label"><i class="dot media"></i>Liquid</p><p class="live-value"><span id="media-value"></span><span class="unit"> °C</span></p></div>
            <div><p class="live-value-label"><i class="dot air"></i>Headspace air</p><p class="live-value"><span id="air-value"></span><span class="unit"> °C</span></p></div>
            <div><p class="live-value-label"><i class="dot water"></i>Jacket water</p><p class="live-value"><span id="water-value"></span><span class="unit"> °C</span></p></div>
          </div>
          <div class="chart-frame">
            <svg id="temperature-chart" class="chart" viewBox="0 0 490 440" role="img" aria-labelledby="chart-title chart-description"><title id="chart-title">Liquid, headspace air, and jacket water temperatures over time</title><desc id="chart-description">The dashed horizontal line marks the liquid target. The vertical cursor follows the time slider.</desc><g id="chart-content"></g></svg>
          </div>
          <p class="target-note" id="target-note"></p>
        </div>
      </div>
      <div class="timeline">
        <button type="button" id="play" class="play-button" aria-label="Play the temperature simulation"><svg viewBox="0 0 14 14" aria-hidden="true"><path id="play-icon" d="M3 1.5L12 7 3 12.5Z"/></svg><span id="play-label">Play</span></button>
        <div class="slider-block">
          <label for="time" class="slider-label">Move through time <span id="replay-description">45-second replay</span></label>
          <input id="time" class="time-range" type="range" min="0" max="1" step="1" value="0">
          <div class="slider-ends"><span>Start</span><span id="timeline-end"></span></div>
        </div>
        <div class="time-readout"><output id="elapsed" for="time">0:00</output><small>elapsed</small></div>
      </div>
      <p id="live-announcement" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
    </section>
    <noscript><p class="error-message">JavaScript is needed for the interactive temperature view.</p></noscript>
  </main>

      $('color-min').textContent = `${fmt(data.color_min_c)} °C`;
      $('color-max').textContent = `${fmt(data.color_max_c)} °C`;
      $('chart-heading').textContent = `Temperature over time · ${fmt(data.volume_l,0)} L`;
      if (hasTarget) {
        $('target-note').innerHTML = `The liquid reaches <strong>${fmt(data.target_c)} °C</strong> after about <strong>${timeWords(data.target_time_s)}</strong>.`;
      } else {
        $('target-note').textContent = `The liquid does not reach its ${fmt(data.target_c)} °C target during this simulation.`;
      }
    }
    refreshScenarioLabels();

    // Frames can be nonuniform. Interpolate all components on the same interval.
    function stateAt(seconds) {
      let low = 0, high = data.times_s.length - 1;
      while (high - low > 1) {
        const middle = (low + high) >> 1;
        if (data.times_s[middle] <= seconds) low = middle; else high = middle;
      }
      const span = data.times_s[high] - data.times_s[low];
      const alpha = span > 0 ? clamp((seconds - data.times_s[low]) / span,0,1) : 0;
      const lerp = values => values[low] + alpha * (values[high] - values[low]);
      return {media:lerp(data.media_c),water:lerp(data.water_c),air:lerp(data.air_c),steel:data.steel_c[low].map((value,index) => value + alpha * (data.steel_c[high][index] - value))};
    }
    let selectedTime = 0, state = stateAt(0);

    // Refit the plot to the available panel size; playback only moves the cursor.
    const svg = $('temperature-chart'), NS = 'http://www.w3.org/2000/svg';
    const chartContent = $('chart-content');
    const plot = {left:43,right:477,top:24,bottom:233};
    let yMin, yMax;
    function refreshChartRange() {
      const observed = [...data.media_c,...data.water_c,...data.air_c,data.target_c];
      yMin = Math.floor((Math.min(...observed)-2) / 5) * 5;
      yMax = Math.ceil((Math.max(...observed)+2) / 5) * 5;
    }
    refreshChartRange();
    const x = seconds => plot.left + seconds / (duration || 1) * (plot.right-plot.left);
    const y = degrees => plot.bottom - (degrees-yMin) / (yMax-yMin || 1) * (plot.bottom-plot.top);
    function node(tag, attrs, text) {
      const item = document.createElementNS(NS,tag);
      Object.entries(attrs || {}).forEach(([name,value]) => item.setAttribute(name,String(value)));
      if (text !== undefined) item.textContent = text;
      chartContent.appendChild(item);
      return item;
    }
    let series = [{name:'water',values:data.water_c,color:colors.water},{name:'air',values:data.air_c,color:colors.gas},{name:'media',values:data.media_c,color:colors.media}];
    let cursor, markers;
    function renderChart(chartWidth,chartHeight) {
      svg.setAttribute('viewBox',`0 0 ${chartWidth} ${chartHeight}`);
      plot.right=chartWidth-14;plot.bottom=chartHeight-43;
      chartContent.replaceChildren();
      node('text',{x:plot.left,y:12,fill:'#68737a','font-size':11},'Temperature (°C)');
      const yStep = yMax-yMin > 35 ? 10 : 5;
      for (let tick = Math.ceil(yMin/yStep)*yStep; tick <= yMax; tick += yStep) {
        node('line',{x1:plot.left,y1:y(tick),x2:plot.right,y2:y(tick),stroke:'#e8ece8','stroke-width':1});
        node('text',{x:plot.left-10,y:y(tick)+4,fill:'#68737a','font-size':11,'text-anchor':'end'},fmt(tick,0));
      }
      const totalHours = duration / 3600;
      const tickHours = totalHours > 12 ? 4 : totalHours > 6 ? 2 : totalHours > 3 ? 1 : totalHours > 1 ? .5 : .25;
      for (let hour=0;hour <= totalHours + 1e-9;hour += tickHours) {
        node('text',{x:x(hour*3600),y:plot.bottom+18,fill:'#68737a','font-size':11,'text-anchor':'middle'},fmt(hour));
      }
      node('text',{x:(plot.left+plot.right)/2,y:chartHeight-4,fill:'#68737a','font-size':11,'text-anchor':'middle'},'Elapsed time (hours)');
      node('line',{x1:plot.left,y1:y(data.target_c),x2:plot.right,y2:y(data.target_c),stroke:'#9aa9a5','stroke-width':1,'stroke-dasharray':'4 5'});
      node('text',{x:plot.left+7,y:y(data.target_c)-6,fill:'#61716b','font-size':11},`${fmt(data.target_c)} °C target`);
      if (hasTarget) {
        node('line',{x1:x(data.target_time_s),y1:y(data.target_c)+5,x2:x(data.target_time_s),y2:plot.bottom,stroke:'#c2ccc7','stroke-width':1,'stroke-dasharray':'3 5'});
      }
      series.forEach(({values,color}) => node('path',{d:values.map((v,i) => `${i ? 'L' : 'M'}${x(data.times_s[i]).toFixed(2)},${y(v).toFixed(2)}`).join(' '),fill:'none',stroke:color,'stroke-width':2.4,'stroke-linejoin':'round','stroke-linecap':'round'}));
      if (hasTarget) node('circle',{cx:x(data.target_time_s),cy:y(data.target_c),r:4,fill:'#fff',stroke:colors.media,'stroke-width':2});
      cursor = node('line',{x1:x(selectedTime),y1:plot.top,x2:x(selectedTime),y2:plot.bottom,stroke:'#344652','stroke-width':1.1,opacity:.5});
      markers = Object.fromEntries(series.map(({name,color}) => [name,node('circle',{cx:x(selectedTime),cy:y(state[name]),r:4,fill:color,stroke:'#fff','stroke-width':1.5})]));
      window.ModelFigureWatermark.svg(svg, plot);
    }

    // Axisymmetric bands are rendered as circumferential patches for illustration.
    // The patches are not extra thermal cells: each row uses one band temperature.
    const canvas = $('vessel'), ctx = canvas.getContext('2d');
    let width=0,height=0,scale=1;
    const initialYaw = -.12, initialPitch = 17 * Math.PI / 180;
    let yaw=initialYaw,pitch=initialPitch;
    const radius = g.radius_m, totalHeight = g.total_height_m;
    const openingStart = Math.PI / 2 - 55 * Math.PI / 180;
    const openingEnd = Math.PI / 2 + 55 * Math.PI / 180;
    const rgb = hex => {
      const value = hex.replace('#','');
      return [parseInt(value.slice(0,2),16),parseInt(value.slice(2,4),16),parseInt(value.slice(4,6),16)];
    };
    const tint = (hex,factor,alpha=1) => `rgba(${rgb(hex).map(v=>Math.round(clamp(v*factor,0,255))).join(',')},${alpha})`;
    const stops = ['#3b63a4','#46a9b0','#d6d89d','#edab58','#be4735'].map(rgb);
    function thermalColor(temperature) {
      const position = clamp((temperature-data.color_min_c)/(data.color_max_c-data.color_min_c || 1),0,1)*(stops.length-1);
      const index = Math.min(stops.length-2,Math.floor(position)), fraction=position-index;
      return '#'+stops[index].map((v,j)=>Math.round(v+(stops[index+1][j]-v)*fraction).toString(16).padStart(2,'0')).join('');
    }
    function radiusAt(z) {
      if (z < g.bottom_head_depth_m) return radius*Math.sqrt(Math.max(0,1-((z-g.bottom_head_depth_m)/g.bottom_head_depth_m)**2));
      const shoulder = g.bottom_head_depth_m+g.cylinder_height_m;
      if (z > shoulder) return radius*Math.sqrt(Math.max(0,1-((z-shoulder)/g.top_head_depth_m)**2));
      return radius;
    }
    function point(r,theta,z) {return [r*Math.cos(theta),r*Math.sin(theta),z];}
    function project(p) {
      const xr=p[0]*Math.cos(yaw)-p[1]*Math.sin(yaw), yr=p[0]*Math.sin(yaw)+p[1]*Math.cos(yaw), zr=p[2]-totalHeight/2;
      return [width/2+xr*scale,height/2-(zr*Math.cos(pitch)-yr*Math.sin(pitch))*scale,yr*Math.cos(pitch)+zr*Math.sin(pitch)];
    }
    function polygon(points,fill,stroke=null,lineWidth=.4) {
      if (!points.length) return;
      ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);
      points.slice(1).forEach(p=>ctx.lineTo(p[0],p[1]));ctx.closePath();
      if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lineWidth;ctx.stroke();}
    }
    const outerAngles = Array.from({length:53},(_,i)=>openingEnd+(Math.PI*2-openingEnd+openingStart)*i/52);
    const allAngles = Array.from({length:73},(_,i)=>Math.PI*2*i/72);
    function drawVessel() {
      if (!width || !height) return;
      ctx.clearRect(0,0,width,height);
      scale=(height-90)/(totalHeight*Math.cos(pitch)+2*radius*Math.sin(Math.abs(pitch)));
      const floor=project([0,0,0]);
      ctx.save();ctx.translate(width/2,floor[1]+17);ctx.scale(1,.19);
      const shadow=ctx.createRadialGradient(0,0,2,0,0,radius*scale*1.35);
      shadow.addColorStop(0,'rgba(35,49,61,.11)');shadow.addColorStop(1,'rgba(35,49,61,0)');
      ctx.fillStyle=shadow;ctx.beginPath();ctx.arc(0,0,radius*scale*1.35,0,Math.PI*2);ctx.fill();ctx.restore();
      const faces=[];
      const face=(world,fill,stroke=null,lineWidth=.4,bias=0)=>{
        const points=world.map(project);
        faces.push({points,fill,stroke,lineWidth,depth:points.reduce((sum,p)=>sum+p[2],0)/points.length+bias});
      };
      data.bands.forEach((band,index)=>{
        const z0=band.lower_m,z1=band.upper_m,r0=band.radius_lower_m,r1=band.radius_upper_m;
        const base=thermalColor(state.steel[index]);
        for(let j=0;j<outerAngles.length-1;j++){
          const a=outerAngles[j],b=outerAngles[j+1],normal=Math.cos((a+b)/2+yaw-.6);
          const shade=.9+.10*normal;
          face([point(r0,a,z0),point(r0,b,z0),point(r1,b,z1),point(r1,a,z1)],tint(base,shade));
        }
        // The exposed cut faces make the exaggerated steel thickness legible.
        [openingStart,openingEnd].forEach(angle=>face([point(r0*.973,angle,z0),point(r0,angle,z0),point(r1,angle,z1),point(r1*.973,angle,z1)],tint(base,.8)));
        // Liquid and air are single bulk states, even though their drawing is curved.
        const isLiquid=(z0+z1)/2 <= g.liquid_height_m;
        const innerColor=isLiquid?colors.media:colors.gas;
        const innerAlpha=isLiquid?.89:.075;
        for(let j=0;j<allAngles.length-1;j++){
          const a=allAngles[j],b=allAngles[j+1];
          // Only the open front needs an interior surface; opaque steel covers the rest.
          if((a+b)/2 < openingStart || (a+b)/2 > openingEnd) continue;
          face([point(r0*.965,a,z0),point(r0*.965,b,z0),point(r1*.965,b,z1),point(r1*.965,a,z1)],tint(innerColor,1.04+.06*Math.cos((a+b)/2+yaw),innerAlpha));
        }
        // A transparent red outer envelope distinguishes the water jacket from steel.
        const j0=Math.max(z0,g.jacket_lower_height_m),j1=Math.min(z1,g.jacket_upper_height_m);
        if(j1>j0){
          const jr0=radiusAt(j0)+radius*.055,jr1=radiusAt(j1)+radius*.055;
          for(let j=0;j<outerAngles.length-1;j++){
            const a=outerAngles[j],b=outerAngles[j+1];
            face([point(jr0,a,j0),point(jr0,b,j0),point(jr1,b,j1),point(jr1,a,j1)],tint(colors.water,1,.045));
          }
          [openingStart,openingEnd].forEach(angle=>face([point(radiusAt(j0),angle,j0),point(jr0,angle,j0),point(jr1,angle,j1),point(radiusAt(j1),angle,j1)],tint(colors.water,1,.78)));
        }
      });
      const liquidRadius=radiusAt(g.liquid_height_m)*.965;
      for(let j=0;j<allAngles.length-1;j++) face([[0,0,g.liquid_height_m],point(liquidRadius,allAngles[j],g.liquid_height_m),point(liquidRadius,allAngles[j+1],g.liquid_height_m)],tint(colors.media,1.17,.94));
      // Short segments carry their own depth, so mesh lines remain behind the liquid.
      data.bands.forEach((band,index)=>{
        const z=band.lower_m,r=band.radius_lower_m;
        for(let j=0;j<outerAngles.length-1;j++){
          const points=[point(r,outerAngles[j],z),point(r,outerAngles[j+1],z)].map(project);
          faces.push({points,fill:null,stroke:'rgba(36,55,65,.23)',lineWidth:.38,depth:(points[0][2]+points[1][2])/2+1e-7,line:true});
        }
      });
      [g.jacket_lower_height_m,g.jacket_upper_height_m].forEach(z=>{
        const r=radiusAt(z),outer=r+radius*.055;
        for(let j=0;j<outerAngles.length-1;j++) face([point(r,outerAngles[j],z),point(outer,outerAngles[j],z),point(outer,outerAngles[j+1],z),point(r,outerAngles[j+1],z)],tint(colors.water,1,.7));
      });
      faces.sort((a,b)=>a.depth-b.depth);
      faces.forEach(item=>{
        if(item.line){ctx.beginPath();ctx.moveTo(...item.points[0].slice(0,2));ctx.lineTo(...item.points[1].slice(0,2));ctx.strokeStyle=item.stroke;ctx.lineWidth=item.lineWidth;ctx.stroke();}
        else polygon(item.points,item.fill,item.stroke,item.lineWidth);
      });
      // These labels refer to bulk compartments, not an unresolved local fluid field.
      const label=(z,title,value,color)=>{
        const p=project([0,0,z]);
        ctx.textAlign='center';ctx.lineJoin='round';ctx.strokeStyle='rgba(255,255,255,.95)';ctx.lineWidth=4;
        ctx.font='600 10px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
        ctx.strokeText(title,p[0],p[1]-6);ctx.fillStyle=color;ctx.fillText(title,p[0],p[1]-6);
        ctx.font='500 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
        const text=`${value.toFixed(1)}°C`;ctx.strokeText(text,p[0],p[1]+17);ctx.fillStyle='#23313d';ctx.fillText(text,p[0],p[1]+17);
      };
      // Hide internal labels when rotation turns the cutaway away from the viewer.
      if(Math.cos(yaw)> .38){
        label((g.liquid_height_m+totalHeight)/2,'HEADSPACE AIR',state.air,'#326d73');
        label(g.liquid_height_m*.54,'LIQUID',state.media,'#9b315f');
      }
      window.ModelFigureWatermark.canvas(ctx, width, height);
    }

    function update(seconds,announce=false){
      selectedTime=clamp(seconds,0,duration);state=stateAt(selectedTime);
      $('time').value=String(selectedTime);$('time').style.setProperty('--progress',`${100*selectedTime/(duration||1)}%`);
      $('time').setAttribute('aria-valuetext',`${timeWords(selectedTime)} elapsed. Liquid ${state.media.toFixed(1)} degrees Celsius, headspace air ${state.air.toFixed(1)} degrees Celsius.`);
      $('elapsed').textContent=timeClock(selectedTime);
      $('media-value').textContent=state.media.toFixed(1);$('air-value').textContent=state.air.toFixed(1);$('water-value').textContent=state.water.toFixed(1);
      cursor.setAttribute('x1',x(selectedTime));cursor.setAttribute('x2',x(selectedTime));
      Object.entries(markers).forEach(([name,item])=>{item.setAttribute('cx',x(selectedTime));item.setAttribute('cy',y(state[name]));});
      drawVessel();
      if(announce)$('live-announcement').textContent=`${timeWords(selectedTime)} elapsed. Liquid ${state.media.toFixed(1)} °C, headspace air ${state.air.toFixed(1)} °C, jacket water ${state.water.toFixed(1)} °C.`;
    }
    let playing=false,lastFrame=0,animationId=null;
    function setPlaying(value){
      playing=value;
      $('play-label').textContent=value?'Pause':'Play';
      $('play').setAttribute('aria-label',value?'Pause the temperature simulation':'Play the temperature simulation');
      $('play-icon').setAttribute('d',value?'M2 1H5V13H2ZM9 1H12V13H9Z':'M3 1.5L12 7 3 12.5Z');
      if(animationId!==null)cancelAnimationFrame(animationId);
      animationId=null;
      if(value){lastFrame=performance.now();animationId=requestAnimationFrame(tick);}
    }
    const volumeInput=$('volume'), volumeSlider=$('volume-slider'), status=$('simulation-status');
    const limits=data.volume_limits_l || {min:400,max:2000};
    const resultsRoot=data.results_root;
    let loading=false;
    [volumeInput,volumeSlider].forEach(input=>{
      input.min=String(limits.min);input.max=String(limits.max);input.value=String(data.volume_l);
    });
    const validVolume = volume => Number.isInteger(volume) && volume>=limits.min && volume<=limits.max;
    const showingVolume = () => `Showing ${fmt(data.volume_l,0)} L`;
    function pendingVolumeChanged() {
      const volume=Number(volumeInput.value), valid=validVolume(volume);
      volumeInput.setCustomValidity(valid?'':`Enter a whole number from ${limits.min} to ${limits.max} liters.`);
      if(valid){volumeSlider.value=String(volume);volumeSlider.style.setProperty('--progress',`${100*(volume-limits.min)/(limits.max-limits.min)}%`);}
      status.dataset.error=String(!valid);
      status.textContent=valid?(volume===data.volume_l?showingVolume():`${showingVolume()} · Select Simulate to apply ${fmt(volume,0)} L.`):`${showingVolume()} · Enter ${fmt(limits.min,0)}–${fmt(limits.max,0)} L in whole liters.`;
    }
    volumeInput.addEventListener('input',pendingVolumeChanged);
    volumeSlider.addEventListener('input',()=>{volumeInput.value=volumeSlider.value;pendingVolumeChanged();});
    pendingVolumeChanged();
    function setLoading(busy) {
      loading=busy;
      $('simulate').disabled=busy;$('simulate').textContent=busy?'Simulating…':'Simulate';
      volumeInput.disabled=busy;volumeSlider.disabled=busy;
      $('time').disabled=busy||duration===0;$('play').disabled=busy||duration===0;
      $('volume-form').setAttribute('aria-busy',String(busy));
    }
    function applySimulation(result) {
      // Replace geometry and all histories together: the moving liquid boundary
      // can change the band count, so old steel indices must never be reused.
      data={...data,...result};g=data.geometry;
      duration=data.times_s[data.times_s.length-1];hasTarget=Number.isFinite(data.target_time_s);
      selectedTime=0;state=stateAt(0);
      series=[{name:'water',values:data.water_c,color:colors.water},{name:'air',values:data.air_c,color:colors.gas},{name:'media',values:data.media_c,color:colors.media}];
      refreshChartRange();refreshScenarioLabels();
      const rect=svg.parentElement.getBoundingClientRect();
      renderChart(rect.width||490,rect.height||440);
      update(0,true);
      status.dataset.error='false';status.textContent=showingVolume();
    }
    $('volume-form').addEventListener('submit',async event=>{
      event.preventDefault();
      if(loading)return;
      const volume=Number(volumeInput.value);
      if(!validVolume(volume)){pendingVolumeChanged();volumeInput.reportValidity();return;}
      if(volume===data.volume_l){pendingVolumeChanged();return;}
      setPlaying(false);setLoading(true);status.dataset.error='false';
      status.textContent=`Simulating ${fmt(volume,0)} L…`;
      const controller=new AbortController();
      const timeout=setTimeout(()=>controller.abort(),20000);
      try {
        const result=await loadResult(resultsRoot,volume,{signal:controller.signal});
        applySimulation(result);
      } catch(error){
        status.dataset.error='true';
        status.textContent=`Could not complete the simulation for ${fmt(volume,0)} L. ${showingVolume()}. Try again.`;
      } finally {
        clearTimeout(timeout);setLoading(false);
      }
    });

    function tick(now){
      if(!playing)return;
      if(now-lastFrame >= 33){
        const elapsed=Math.min((now-lastFrame)/1000,.2);lastFrame=now;
        update(selectedTime+elapsed*duration/45);
        if(selectedTime>=duration){setPlaying(false);update(duration,true);return;}
      }
      animationId=requestAnimationFrame(tick);
    }
    $('play').addEventListener('click',()=>{if(!playing&&selectedTime>=duration)update(0);setPlaying(!playing);});
    $('time').addEventListener('input',event=>{setPlaying(false);update(Number(event.target.value));});
    $('time').addEventListener('change',()=>update(selectedTime,true));
    document.addEventListener('visibilitychange',()=>{if(document.hidden)setPlaying(false);});
    // No autoplay. Explicit replay remains available when reduced motion is requested.
    if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)$('replay-description').textContent='Use the slider or play';
    const resetView=()=>{yaw=initialYaw;pitch=initialPitch;drawVessel();};
    $('reset-view').addEventListener('click',resetView);
    let drag=null;
    canvas.addEventListener('pointerdown',event=>{drag={x:event.clientX,y:event.clientY,yaw,pitch};canvas.setPointerCapture(event.pointerId);canvas.classList.add('dragging');});
    // Positive yaw moves the visible front left; subtract the drag to follow the pointer.
    canvas.addEventListener('pointermove',event=>{if(!drag)return;yaw=drag.yaw-(event.clientX-drag.x)*.008;pitch=clamp(drag.pitch+(event.clientY-drag.y)*.005,-.12,.7);drawVessel();});
    const endDrag=()=>{drag=null;canvas.classList.remove('dragging');};
    canvas.addEventListener('pointerup',endDrag);canvas.addEventListener('pointercancel',endDrag);
    canvas.addEventListener('keydown',event=>{
      if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home'].includes(event.key))return;
      event.preventDefault();
      if(event.key==='Home'){resetView();return;}
      if(event.key==='ArrowLeft')yaw+=.12;if(event.key==='ArrowRight')yaw-=.12;
      if(event.key==='ArrowUp')pitch=clamp(pitch-.06,-.12,.7);if(event.key==='ArrowDown')pitch=clamp(pitch+.06,-.12,.7);drawVessel();
    });
    new ResizeObserver(()=>{
      const rect=canvas.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2);
      width=rect.width;height=rect.height;canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);drawVessel();
    }).observe(canvas);
    // Match SVG units to pixels so a taller plot keeps text and markers undistorted.
    new ResizeObserver(entries=>{
      const rect=entries[0].contentRect;
      if(rect.width>0 && rect.height>0)renderChart(rect.width,rect.height);
    }).observe(svg.parentElement);
    renderChart(490,440);
    update(0);
  })();
  </script>
</body>
</html>
