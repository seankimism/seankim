<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PI control toward 36.5 °C</title><style>body{font:15px/1.55 system-ui,sans-serif;color:#24313d;background:#fff;margin:0 auto;padding:22px;max-width:1150px}
h1{font-size:25px}h2{font-size:20px}a{color:#185f87}p{max-width:95ch}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}

@media(max-width:620px){.grid{grid-template-columns:1fr}body{padding:14px}h1{font-size:22px}}</style><h1>PI control toward 36.5 °C</h1><p><a href="../index.html">All thermal results</a></p><section aria-label="XDR-2000 · 2,000 L"><div class="grid"><figure><div class="youtube-player youtube-player--portrait" data-youtube-id="Et4q5rd8OYI" data-youtube-title="XDR-2000: Agitation off"><button type="button" class="youtube-player__button" aria-label="Play XDR-2000: Agitation off"><img src="posters/xdr2000_off.png?v=c234943831c4" alt="" loading="lazy" width="640" height="760"><span class="youtube-player__play" aria-hidden="true">&#9654;</span></button></div><figcaption>XDR-2000, 2,000 L working liquid; agitation off, initially 4 °C. PI control toward 36.5 °C. Final bulk 26.71 °C; coldest source cell 14.45 °C after 16 h. Bulk 36.5 °C target was not reached. 7,680 source cells (80 × 96), displayed as 40 × 48 volume averages; visible boundaries are display cells. Fixed 4–40 °C color scale. Playback interpolates saved temperatures at 25 frames/s with a steady simulation clock. Ideal thermal boundary; these fields are illustrative, not equipment validation. <a href="https://www.youtube.com/watch?v=Et4q5rd8OYI">Watch on YouTube</a></figcaption></figure><figure><div class="youtube-player youtube-player--portrait" data-youtube-id="KZUUcZs1KBE" data-youtube-title="XDR-2000: 30 s mixing"><button type="button" class="youtube-player__button" aria-label="Play XDR-2000: 30 s mixing"><img src="posters/xdr2000_30s.png?v=19fdeae622e7" alt="" loading="lazy" width="640" height="760"><span class="youtube-player__play" aria-hidden="true">&#9654;</span></button></div><figcaption>XDR-2000, 2,000 L working liquid; 30 s mixing, initially 4 °C. PI control toward 36.5 °C. Final bulk 36.56 °C; coldest source cell 36.56 °C after 16 h. 7,680 source cells (80 × 96), displayed as 40 × 48 volume averages; visible boundaries are display cells. Fixed 4–40 °C color scale. Playback interpolates saved temperatures at 25 frames/s with a steady simulation clock. Ideal thermal boundary; these fields are illustrative, not equipment validation. <a href="https://www.youtube.com/watch?v=KZUUcZs1KBE">Watch on YouTube</a></figcaption></figure></div></section><section aria-label="Applikon 3 L vessel · 2 L"><div class="grid"><figure><div class="youtube-player youtube-player--portrait" data-youtube-id="RQqO05G8K2E" data-youtube-title="Applikon 3 L vessel: Agitation off"><button type="button" class="youtube-player__button" aria-label="Play Applikon 3 L vessel: Agitation off"><img src="posters/applikon3l_off.png?v=732117fdf9b2" alt="" loading="lazy" width="640" height="760"><span class="youtube-player__play" aria-hidden="true">&#9654;</span></button></div><figcaption>Applikon 3 L vessel, 2 L working liquid; agitation off, initially 4 °C. PI control toward 36.5 °C. Final bulk 36.51 °C; coldest source cell 30.07 °C after 8 h. 7,680 source cells (80 × 96), displayed as 40 × 48 volume averages; visible boundaries are display cells. Fixed 4–40 °C color scale. Playback interpolates saved temperatures at 25 frames/s with a steady simulation clock. Ideal thermal boundary; these fields are illustrative, not equipment validation. <a href="https://www.youtube.com/watch?v=RQqO05G8K2E">Watch on YouTube</a></figcaption></figure><figure><div class="youtube-player youtube-player--portrait" data-youtube-id="K3MycGQ5YKo" data-youtube-title="Applikon 3 L vessel: 5 s mixing"><button type="button" class="youtube-player__button" aria-label="Play Applikon 3 L vessel: 5 s mixing"><img src="posters/applikon3l_5s.png?v=6c68693bafb2" alt="" loading="lazy" width="640" height="760"><span class="youtube-player__play" aria-hidden="true">&#9654;</span></button></div><figcaption>Applikon 3 L vessel, 2 L working liquid; 5 s mixing, initially 4 °C. PI control toward 36.5 °C. Final bulk 36.50 °C; coldest source cell 36.11 °C after 8 h. 7,680 source cells (80 × 96), displayed as 40 × 48 volume averages; visible boundaries are display cells. Fixed 4–40 °C color scale. Playback interpolates saved temperatures at 25 frames/s with a steady simulation clock. Ideal thermal boundary; these fields are illustrative, not equipment validation. <a href="https://www.youtube.com/watch?v=K3MycGQ5YKo">Watch on YouTube</a></figcaption></figure></div></section><section aria-label="ambr250 · 200 mL"><div class="grid"><figure><div class="youtube-player youtube-player--portrait" data-youtube-id="5EVSXXdrkbc" data-youtube-title="ambr250: Agitation off"><button type="button" class="youtube-player__button" aria-label="Play ambr250: Agitation off"><img src="posters/ambr250_off.png?v=d00ba7a76f40" alt="" loading="lazy" width="640" height="760"><span class="youtube-player__play" aria-hidden="true">&#9654;</span></button></div><figcaption>ambr250, 200 mL working liquid; agitation off, initially 4 °C. PI control toward 36.5 °C. Final bulk 36.56 °C; coldest source cell 35.82 °C after 2 h. 7,680 source cells (80 × 96), displayed as 40 × 48 volume averages; visible boundaries are display cells. Fixed 4–40 °C color scale. Playback interpolates saved temperatures at 25 frames/s with a steady simulation clock. Ideal thermal boundary; these fields are illustrative, not equipment validation. <a href="https://www.youtube.com/watch?v=5EVSXXdrkbc">Watch on YouTube</a></figcaption></figure><figure><div class="youtube-player youtube-player--portrait" data-youtube-id="vWDyzcVEasw" data-youtube-title="ambr250: 10 s mixing"><button type="button" class="youtube-player__button" aria-label="Play ambr250: 10 s mixing"><img src="posters/ambr250_10s.png?v=fc881ca524fc" alt="" loading="lazy" width="640" height="760"><span class="youtube-player__play" aria-hidden="true">&#9654;</span></button></div><figcaption>ambr250, 200 mL working liquid; 10 s mixing, initially 4 °C. PI control toward 36.5 °C. Final bulk 36.54 °C; coldest source cell 36.52 °C after 2 h. 7,680 source cells (80 × 96), displayed as 40 × 48 volume averages; visible boundaries are display cells. Fixed 4–40 °C color scale. Playback interpolates saved temperatures at 25 frames/s with a steady simulation clock. Ideal thermal boundary; these fields are illustrative, not equipment validation. <a href="https://www.youtube.com/watch?v=vWDyzcVEasw">Watch on YouTube</a></figcaption></figure></div></section><script>
document.addEventListener('click', function(event) {
  const button = event.target.closest('.youtube-player__button');
  if (!button) return;
  const player = button.closest('.youtube-player');
  const id = player.dataset.youtubeId;
  if (!/^[A-Za-z0-9_-]{11}$/.test(id)) return;
  const frame = document.createElement('iframe');
  frame.src = 'https://www.youtube-nocookie.com/embed/' + id + '?autoplay=1';
  frame.title = player.dataset.youtubeTitle;
  frame.allow = 'autoplay; encrypted-media; fullscreen; picture-in-picture';
  frame.allowFullscreen = true;
  frame.referrerPolicy = 'strict-origin-when-cross-origin';
  frame.tabIndex = 0;
  player.replaceChildren(frame);
  frame.focus();
});
</script></html>
