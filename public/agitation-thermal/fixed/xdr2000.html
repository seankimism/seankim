<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XDR-2000 · 2,000 L · Fixed 40 °C heating source</title><style>body{font:15px/1.55 system-ui,sans-serif;color:#24313d;background:#fff;margin:0 auto;padding:22px;max-width:1150px}
h1{font-size:25px}h2{font-size:20px}a{color:#185f87}p{max-width:95ch}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
figure{margin:0}video{display:block;width:100%;max-height:680px;background:#fff}figcaption{font-size:13px;margin:10px 0 20px}
table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:8px;border-bottom:1px solid #d6dce1;text-align:left;vertical-align:top}
.scroll{overflow:auto}.note{padding:12px;border-left:3px solid #8596a2;background:#f4f6f8}section{margin-bottom:32px}
.youtube-player{position:relative;width:100%;background:#fff;overflow:hidden}.youtube-player--portrait{aspect-ratio:640/760;max-width:640px;margin-inline:auto}.youtube-player--landscape{aspect-ratio:1080/650}
.youtube-player__button{display:block;position:relative;width:100%;height:100%;padding:0;border:0;background:#fff;cursor:pointer}.youtube-player__button img{width:100%;height:100%;object-fit:contain;display:block}
.youtube-player__play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:grid;place-items:center;width:64px;height:46px;border-radius:12px;background:#a61722;color:white;font-size:24px;box-shadow:0 2px 10px #0004}
.youtube-player__button:focus-visible{outline:3px solid #185f87;outline-offset:-3px}.youtube-player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
@media(max-width:620px){.grid{grid-template-columns:1fr}body{padding:14px}h1{font-size:22px}}</style><h1>XDR-2000 · 2,000 L · Fixed 40 °C heating source</h1><p><a href="../index.html">All thermal results</a></p><div class="grid"><figure><div class="youtube-player youtube-player--portrait" data-youtube-id="cyiFmI-HQvo" data-youtube-title="XDR-2000: Agitation off"><button type="button" class="youtube-player__button" aria-label="Play XDR-2000: Agitation off"><img src="posters/xdr2000_off.png?v=d336d6444e7f" alt="" loading="lazy" width="640" height="760"><span class="youtube-player__play" aria-hidden="true">&#9654;</span></button></div><figcaption>XDR-2000, 2,000 L working liquid; agitation off, initially 4 °C. Fixed 40 °C heating source. Final bulk 26.71 °C; coldest source cell 14.45 °C after 16 h. Bulk 36.5 °C target was not reached. 7,680 source cells (80 × 96), displayed as 40 × 48 volume averages; visible boundaries are display cells. Fixed 4–40 °C color scale. Playback interpolates saved temperatures at 25 frames/s with a steady simulation clock. Ideal thermal boundary; these fields are illustrative, not equipment validation. <a href="https://www.youtube.com/watch?v=cyiFmI-HQvo">Watch on YouTube</a></figcaption></figure><figure><div class="youtube-player youtube-player--portrait" data-youtube-id="_aUtnSDyXbo" data-youtube-title="XDR-2000: 30 s mixing"><button type="button" class="youtube-player__button" aria-label="Play XDR-2000: 30 s mixing"><img src="posters/xdr2000_30s.png?v=5bf607c2244a" alt="" loading="lazy" width="640" height="760"><span class="youtube-player__play" aria-hidden="true">&#9654;</span></button></div><figcaption>XDR-2000, 2,000 L working liquid; 30 s mixing, initially 4 °C. Fixed 40 °C heating source. Final bulk 39.49 °C; coldest source cell 39.49 °C after 16 h. 7,680 source cells (80 × 96), displayed as 40 × 48 volume averages; visible boundaries are display cells. Fixed 4–40 °C color scale. Playback interpolates saved temperatures at 25 frames/s with a steady simulation clock. Ideal thermal boundary; these fields are illustrative, not equipment validation. <a href="https://www.youtube.com/watch?v=_aUtnSDyXbo">Watch on YouTube</a></figcaption></figure></div><script>
document.addEventListener('click', function(event) {
  const button = event.target.closest('.youtube-player__button');
  if (!button) return;
  const player = button.closest('.youtube-player');
  const id = player.dataset.youtubeId;
  if (!/^[A-Za-z0-9_-]{11}$/.test(id)) return;
  const frame = document.createElement('iframe');
  frame.src = 'https://www.youtube-nocookie.com/embed/' + id + '?autoplay=1';
  frame.title = player.dataset.youtubeTitle;
  frame.allow = 'autoplay; encrypted-media; fullscreen; picture-in-picture';
  frame.allowFullscreen = true;
  frame.referrerPolicy = 'strict-origin-when-cross-origin';
  frame.tabIndex = 0;
  player.replaceChildren(frame);
  frame.focus();
});
</script></html>
