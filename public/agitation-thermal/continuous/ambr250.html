<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AMBR continuous top feeding</title><style>body{font:15px/1.55 system-ui,sans-serif;color:#24313d;background:#fff;margin:0 auto;padding:22px;max-width:1150px}
h1{font-size:25px}h2{font-size:20px}a{color:#185f87}p{max-width:95ch}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
figure{margin:0}video{display:block;width:100%;max-height:680px;background:#fff}figcaption{font-size:13px;margin:10px 0 20px}
table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:8px;border-bottom:1px solid #d6dce1;text-align:left;vertical-align:top}
.scroll{overflow:auto}.note{padding:12px;border-left:3px solid #8596a2;background:#f4f6f8}section{margin-bottom:32px}
.youtube-player{position:relative;width:100%;background:#fff;overflow:hidden}.youtube-player--portrait{aspect-ratio:640/760;max-width:640px;margin-inline:auto}.youtube-player--landscape{aspect-ratio:1080/650}
.youtube-player__button{display:block;position:relative;width:100%;height:100%;padding:0;border:0;background:#fff;cursor:pointer}.youtube-player__button img{width:100%;height:100%;object-fit:contain;display:block}
.youtube-player__play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:grid;place-items:center;width:64px;height:46px;border-radius:12px;background:#a61722;color:white;font-size:24px;box-shadow:0 2px 10px #0004}
.youtube-player__button:focus-visible{outline:3px solid #185f87;outline-offset:-3px}.youtube-player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
@media(max-width:620px){.grid{grid-template-columns:1fr}body{padding:14px}h1{font-size:22px}}</style><h1>AMBR continuous top feeding</h1><p><a href="../index.html">All thermal results</a></p><figure><div class="youtube-player youtube-player--landscape" data-youtube-id="uxsH2nxGo14" data-youtube-title="AMBR: 4 °C and 20 °C continuous feed"><button type="button" class="youtube-player__button" aria-label="Play AMBR: 4 °C and 20 °C continuous feed"><img src="posters/ambr250_agitation_on_top_feed.png?v=e04c0e3e0149" alt="" loading="lazy" width="1080" height="650"><span class="youtube-player__play" aria-hidden="true">&#9654;</span></button></div><figcaption>AMBR: 160 to 200 mL, with 40 mL added from the top over 30 min after the first bulk 36.5 °C crossing. Left 4 °C feed, right 20 °C feed; prescribed 10 s global mixing, ideal PI control, 120 source cells, visible source boundaries. Two hours of recovery follow. Playback at 25 frames/s interpolates liquid volume and sensible heat between the saved 10 s inventory updates; this is display interpolation of a coarse continuous-feed approximation. <a href="https://www.youtube.com/watch?v=uxsH2nxGo14">Watch on YouTube</a></figcaption></figure><script>
document.addEventListener('click', function(event) {
  const button = event.target.closest('.youtube-player__button');
  if (!button) return;
  const player = button.closest('.youtube-player');
  const id = player.dataset.youtubeId;
  if (!/^[A-Za-z0-9_-]{11}$/.test(id)) return;
  const frame = document.createElement('iframe');
  frame.src = 'https://www.youtube-nocookie.com/embed/' + id + '?autoplay=1';
  frame.title = player.dataset.youtubeTitle;
  frame.allow = 'autoplay; encrypted-media; fullscreen; picture-in-picture';
  frame.allowFullscreen = true;
  frame.referrerPolicy = 'strict-origin-when-cross-origin';
  frame.tabIndex = 0;
  player.replaceChildren(frame);
  frame.focus();
});
</script></html>
