<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" role="img" aria-labelledby="t d" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">Measured free-surface oxygen and carbon dioxide transfer coefficients against working volume</title>
  <desc id="d">Both axes are logarithmic. The data span working volumes of about 0.2 to 2000 litres. Solid green and dashed orange lines show the Bowers 2008 oxygen and carbon dioxide measurements in four vessels from 8 to 2000 litres. The purple circle is Clark 2020, ambr 250 at 215 mL and 300 rpm, with a surface oxygen transfer coefficient of 1.10 per hour. Capped vertical bars show selected oxygen-transfer conditions for Al-Ramadhani at 0.3 L, Wyrobnik at 1 L, Scargiali at 5.4 L, de Lamotte at 16.5 L and Schlaich at 40 L. The Schlaich range covers up-pumping at 60 to 90 rpm. These ranges are not measurement error bars.</desc>
